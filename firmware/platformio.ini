[platformio]
default_envs = stm32h743xih6
include_dir = inc

[env:stm32h743xih6]
platform = ststm32@19.7.0
board = stm32h743xih6
framework = stm32cube

board_build.ldscript = STM32H743XIHx_FLASH.ld
extra_scripts = pre:tools/pio_fpu.py

upload_protocol = stlink
debug_tool = stlink
debug_speed = 4000
debug_extra_cmds = monitor arm semihosting enable

build_unflags = -Os

build_flags =
  -O2
  -g3
  -Wextra
  -Wno-unused-parameter
  -mfpu=fpv5-d16
  -mfloat-abi=hard
